packages:
  - apps/*
  - packages/*
  - packages/@repo/*

allowBuilds:
  '@swc/core': false
  better-sqlite3: false
  esbuild: false
  pnpm: true
  protobufjs: false
  sharp: false
  unrs-resolver: false

catalog:
  '@sanity/assist': ^6.2.0
  '@sanity/client': ^8.6.2
  '@sanity/cli': ^8.12.0
  '@sanity/color-input': ^6.1.4
  '@sanity/icons': ^5.2.2
  '@sanity/mutate': ^0.18.2
  '@sanity/pkg-utils': ^12.3.4
  '@sanity/telemetry': ^1.1.0
  '@sanity/tsconfig': 2.2.1
  '@sanity/types': ^6.15.0
  '@sanity/ui': ^4.2.1
  '@sanity/util': ^6.15.0
  '@sanity/vision': ^6.15.0
  '@sveltejs/adapter-auto': ^7.0.1
  '@sveltejs/kit': ^2.70.3
  '@sveltejs/package': ^2.5.8
  '@sveltejs/vite-plugin-svelte': ^7.3.0
  '@types/node': ^24.19.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/three': ^0.186.0
  babel-plugin-react-compiler: ^1.0.0
  groq: ^6.15.0
  knip: ^6.37.0
  oxfmt: ^0.68.0
  oxlint: ^1.83.0
  oxlint-tsgolint: ^7.0.2002
  react: ^19.3.0
  react-dom: ^19.3.0
  rxjs: ^7.8.2
  sanity: ^6.15.0
  sanity-plugin-asset-source-unsplash: ^7.0.25
  styled-components: ^6.5.3
  svelte: ^5.57.0
  turbo: ^2.10.12
  typescript: 6.0.3
  vite: ^8.3.0
  vitest: ^4.1.11
  xstate: ^5.33.2
  pnpm: 12.3.4

catalogs:
  tailwind3:
    '@tailwindcss/postcss': ^4.3.3
    '@tailwindcss/typography': ^0.5.20
    tailwindcss: ^4.3.3

catalogMode: prefer
dedupeDirectDeps: true
dedupePeers: true
linkWorkspacePackages: deep

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@portabletext/*'
  - '@sanity/*'
  - '@types/*'
  - '@typescript/*'
  - '@vite/*'
  - '@vitejs/*'
  - '@vitest/*'
  - '@yuku-codegen/*'
  - '@yuku-parser/*'
  - '@yuku-toolchain/*'
  - get-it
  - groq
  - groq-js
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - react
  - react-dom
  - react-is
  - rolldown
  - rolldown-plugin-dts
  - tsdown
  - verkit
  - vite
  - vitest
  - yuku-*

overrides:
  '@sanity/client': 'catalog:'
  '@sanity/core-loader': 'workspace:*'
  '@sanity/preview-url-secret': 'workspace:*'
  '@sanity/react-loader': 'workspace:*'
  '@sanity/svelte-loader': 'workspace:*'
  '@sanity/types': 'catalog:'
  '@sanity/util': 'catalog:'
  '@sanity/visual-editing': 'workspace:*'
  '@sanity/visual-editing-csm': 'workspace:*'
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  groq: 'catalog:'
  sanity: 'catalog:'

peerDependencyRules:
  allowAny:
    - '@tsdown/css'
    - '@sanity/client'
    - next
    - react
    - react-dom
    - tailwindcss

preferWorkspacePackages: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@octokit/endpoint@9.0.6'
  - '@octokit/plugin-paginate-rest@9.2.2'
  - chokidar@4.0.3
  - react-redux@9.2.0
  - reselect@5.1.1
  - rxjs@7.8.2
  - semver@5.7.2 || 6.3.1
  - undici@5.29.0
  - undici-types@6.21.0
  - vite@6.4.1
