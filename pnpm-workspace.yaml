packages:
  - apps/*
  - packages/*
  - packages/@repo/*

allowBuilds:
  '@swc/core': false
  better-sqlite3: false
  esbuild: false
  pnpm: true
  protobufjs: false
  sharp: false
  unrs-resolver: false

catalog:
  '@sanity/assist': ^6.3.0
  '@sanity/client': ^8.17.0
  '@sanity/cli': ^8.32.1
  '@sanity/color-input': ^6.1.10
  '@sanity/icons': ^5.4.0
  '@sanity/mutate': ^0.18.2
  '@sanity/pkg-utils': ^14.0.0
  '@sanity/telemetry': ^1.1.0
  '@sanity/tsconfig': 2.2.1
  '@sanity/types': ^6.24.0
  '@sanity/ui': ^4.4.12
  '@sanity/util': ^6.24.0
  '@sanity/vision': ^6.24.0
  '@sveltejs/adapter-auto': ^9.0.0
  '@sveltejs/kit': ^2.70.4
  '@sveltejs/package': ^3.0.3
  '@sveltejs/vite-plugin-svelte': ^7.3.0
  '@tsdown/css': ^0.23.7
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/three': ^0.187.0
  babel-plugin-react-compiler: ^1.0.0
  groq: ^6.24.0
  knip: ^6.46.1
  oxfmt: ^0.79.0
  oxlint: ^1.94.0
  oxlint-tsgolint: ^7.0.2007
  react: ^19.3.1
  react-dom: ^19.3.1
  rxjs: ^7.8.2
  sanity: ^6.24.0
  sanity-plugin-asset-source-unsplash: ^7.0.31
  styled-components: ^6.6.0
  svelte: ^5.58.0
  tsdown: ^0.23.7
  turbo: ^2.11.13
  typescript: 6.0.3
  vite: ^8.3.8
  vitest: ^4.1.12
  xstate: ^5.33.4
  pnpm: 12.21.0

catalogs:
  tailwind3:
    '@tailwindcss/postcss': ^4.3.5
    '@tailwindcss/typography': ^0.5.20
    tailwindcss: ^4.3.5

catalogMode: prefer
dedupeDirectDeps: true
dedupePeers: true
linkWorkspacePackages: deep

lockfile:
  format: v13

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@portabletext/*'
  - '@rolldown/binding-android-arm-eabi@1.3.3'
  - '@rolldown/binding-android-arm64@1.3.3'
  - '@rolldown/binding-darwin-arm64@1.3.3'
  - '@rolldown/binding-darwin-x64@1.3.3'
  - '@rolldown/binding-freebsd-x64@1.3.3'
  - '@rolldown/binding-linux-arm-gnueabihf@1.3.3'
  - '@rolldown/binding-linux-arm64-gnu@1.3.3'
  - '@rolldown/binding-linux-arm64-musl@1.3.3'
  - '@rolldown/binding-linux-ppc64-gnu@1.3.3'
  - '@rolldown/binding-linux-s390x-gnu@1.3.3'
  - '@rolldown/binding-linux-x64-gnu@1.3.3'
  - '@rolldown/binding-linux-x64-musl@1.3.3'
  - '@rolldown/binding-openharmony-arm64@1.3.3'
  - '@rolldown/binding-wasm32-wasi@1.3.3'
  - '@rolldown/binding-win32-arm64-msvc@1.3.3'
  - '@rolldown/binding-win32-x64-msvc@1.3.3'
  - '@sanity/*'
  - '@sanity/tsdown-config'
  - '@sveltejs/adapter-auto@9.0.0'
  - '@tanstack/react-virtual'
  - '@tanstack/virtual-core'
  - '@types/*'
  - '@typescript/*'
  - '@vite/*'
  - '@vitejs/*'
  - '@vitest/*'
  - '@yuku-codegen/*'
  - '@yuku-parser/*'
  - '@yuku-toolchain/*'
  - framer-motion
  - get-it
  - groq
  - groq-js
  - motion
  - motion-dom
  - motion-utils
  - next-sanity@13.5.1
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - react
  - react-dom
  - react-is
  - styled-components
  - rolldown
  - rolldown-plugin-dts
  - sanity
  - tsdown
  - verkit
  - vite
  - vitest
  - yuku-*

overrides:
  '@sanity/client': 'catalog:'
  '@sanity/core-loader': 'workspace:*'
  '@sanity/preview-url-secret': 'workspace:*'
  '@sanity/react-loader': 'workspace:*'
  '@sanity/svelte-loader': 'workspace:*'
  '@sanity/types': 'catalog:'
  '@sanity/util': 'catalog:'
  '@sanity/visual-editing': 'workspace:*'
  '@sanity/visual-editing-csm': 'workspace:*'
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  groq: 'catalog:'
  sanity: 'catalog:'

peerDependencyRules:
  allowAny:
    - '@tsdown/css'
    - '@sanity/client'
    - next
    - react
    - react-dom
    - tailwindcss

preferWorkspacePackages: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@octokit/endpoint@9.0.6'
  - '@octokit/plugin-paginate-rest@9.2.2'
  - '@pierre/theme@2.0.0'
  # 8.3.1 shipped with provenance; 8.3.3 (pulled in by @sanity/cli@8.32.1) did not
  - '@sanity/codegen@8.3.3'
  - chokidar@4.0.3
  - react-redux@9.2.0
  - reselect@5.1.1
  - rxjs@7.8.2
  - semver@5.7.2 || 6.3.1
  - undici@5.29.0
  - undici-types@6.21.0
  - vite@6.4.1
